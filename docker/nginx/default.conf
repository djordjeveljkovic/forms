server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Security: hide sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ ^/(storage|bootstrap|tests|database|config|docker|resources)/ {
        deny all;
    }

    # Static assets — serve directly, with long cache for fingerprinted files
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|gif|webp|avif|mp4|webm|ogg|wasm)$ {
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Livewire + Flux assets (Vite manifest)
    location /build {
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /livewire {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
    location /flux {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # WebSocket support for Livewire
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Main entrypoint: hand off to PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM backend
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;

        # Livewire WebSocket headers
        fastcgi_param HTTP_UPGRADE $http_upgrade;
        fastcgi_param HTTP_CONNECTION $connection_upgrade;

        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;

        include fastcgi_params;
    }

    # Block PHP execution in uploads directory
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
